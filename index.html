<style>
  :root{
    --bg:#08080b;
    --bg-2:#101017;
    --fg:#f5f5f7;
    --muted:#9a9aa6;
    --accent:#ff3b30;
    --line:rgba(255,255,255,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
  }
  /* soft glow behind hero */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(60rem 40rem at 50% -10%, rgba(255,59,48,.16), transparent 70%),
      radial-gradient(40rem 30rem at 100% 100%, rgba(90,120,255,.10), transparent 70%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:72px 16px 48px;
    gap:28px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:-.01em;
    font-size:17px;
  }
  .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 18px rgba(255,59,48,.8);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:999px;
  }
  h1{
    margin:0;
    font-weight:800;
    letter-spacing:-.035em;
    line-height:1.02;
    font-size:clamp(40px,10vw,86px);
    max-width:16ch;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .sub{
    margin:0;
    color:var(--muted);
    font-size:clamp(15.5px,2.6vw,19px);
    line-height:1.55;
    max-width:46ch;
  }
  .cta-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    padding:13px 22px;
    border-radius:999px;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#ff5247}
  .btn-ghost{border:1px solid var(--line);color:var(--fg)}
  .btn-ghost:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
  .socials{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:4px;
  }
  .socials a{
    width:44px;height:44px;
    display:grid;place-items:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--muted);
    background:rgba(255,255,255,.03);
    transition:color .15s ease, border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .socials a:hover{
    color:#fff;
    border-color:rgba(255,255,255,.28);
    background:rgba(255,255,255,.08);
    transform:translateY(-2px);
  }
  .socials svg{width:19px;height:19px;fill:currentColor}
  footer{
    position:relative;z-index:1;
    text-align:center;
    color:#5f5f6b;
    font-size:12.5px;
    padding:0 16px 28px;
  }
  footer a{color:#8a8a96;text-decoration:none}
  footer a:hover{color:#fff}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
